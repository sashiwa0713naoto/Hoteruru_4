<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <div th:replace="~{fragment :: meta}"></div>
        <div th:replace="~{fragment :: styles}"></div>
        <title>会員情報</title>
    </head>
    <body>
        <div class="moattravel-wrapper d-flex flex-column min-vh-100">
            <!-- ヘッダー -->
            <div th:replace="~{fragment :: header}"></div>

            <main class="flex-grow-1">
                <div class="container pt-4 pb-5 moattravel-container">
                    <div class="row">
                        <div class="col-xl-5 col-lg-6 col-md-8 mx-auto">
                            <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                                <ol class="breadcrumb mb-0">
                                    <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">会員情報</li>
                                </ol>
                            </nav>

                            <h1 class="mb-4 text-center">会員情報</h1>

                            <div th:if="${successMessage}" class="alert alert-info" role="alert">
                                <span th:text="${successMessage}"></span>
                            </div>

                            <div class="container mb-4">
                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 fw-bold">氏名</div>
                                    <div class="col-8" th:text="${user.name}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 fw-bold">フリガナ</div>
                                    <div class="col-8" th:text="${user.furigana}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 fw-bold">郵便番号</div>
                                    <div class="col-8" th:text="${user.postalCode}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 fw-bold">住所</div>
                                    <div class="col-8" th:text="${user.address}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 fw-bold">電話番号</div>
                                    <div class="col-8" th:text="${user.phoneNumber}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 fw-bold">メールアドレス</div>
                                    <div class="col-8" th:text="${user.email}"></div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-center">
                                <a th:href="@{/user/edit}" class="btn text-white shadow-sm w-50 moattravel-btn" style="background-color: #0284c7;">編集する</a>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- フッター -->
            <div th:replace="~{fragment :: footer}"></div>
        </div>

        <div th:replace="~{fragment :: scripts}"></div>
    </body>
</html>
